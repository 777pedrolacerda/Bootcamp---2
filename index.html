<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiosidades Numéricas</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1>Explorador de Números</h1>
        <p>Descubra fatos curiosos sobre qualquer número!</p>
    </header>

    <main>
        <section class="busca">
            <input type="number" id="campo-numero" placeholder="Digite um número (ex: 42)">
            <select id="campo-tipo">
                <option value="trivia">Geral (Trivia)</option>
                <option value="math">Matemática</option>
                <option value="year">Ano Histórico</option>
            </select>
            <button id="botao-buscar">Buscar Fato</button>
        </section>

        <section id="resultado"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
